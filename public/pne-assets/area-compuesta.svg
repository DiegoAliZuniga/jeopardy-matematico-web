  </style>
  <text x="48" y="52" class="title">Figura compuesta</text>
  <text x="48" y="88" class="subtitle">Rectángulo de 10 m por 6 m con una esquina de 4 m por 2 m retirada.</text>
  
  <path d="M 190 145 H 520 V 245 H 770 V 435 H 190 Z" fill="#d9f0f5" stroke="#146c86" stroke-width="6"/>
