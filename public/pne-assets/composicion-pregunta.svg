  </style>
  <text x="48" y="52" class="title">Funciones f y g</text>
  <text x="48" y="88" class="subtitle">Determina el orden correcto para calcular (f∘g)(3).</text>
  
  <rect x="150" y="185" width="280" height="170" rx="18" fill="#e8f5f7" stroke="#146c86" stroke-width="4"/>
  <rect x="530" y="185" width="280" height="170" rx="18" fill="#f2ecfb" stroke="#6d4bc3" stroke-width="4"/>
  <text x="290" y="255" text-anchor="middle" class="label">f(x)=2x+1</text>
