<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Composición de funciones">
  <rect width="960" height="540" rx="24" fill="#f8fbfc"/>
  <rect x="1" y="1" width="958" height="538" rx="23" fill="none" stroke="#c8d9de" stroke-width="2"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #07313d; letter-spacing: 0; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #5d737a; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
  </style>
  <text x="48" y="52" class="title">Composición de funciones</text>
  <text x="48" y="88" class="subtitle">La salida de g se utiliza como entrada de f.</text>
  
  <defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e36b55"/></marker></defs>
  <rect x="90" y="205" width="190" height="120" rx="18" fill="#e8f5f7" stroke="#146c86" stroke-width="4"/>
  <rect x="385" y="205" width="190" height="120" rx="18" fill="#f2ecfb" stroke="#6d4bc3" stroke-width="4"/>
  <rect x="680" y="205" width="190" height="120" rx="18" fill="#fff4ce" stroke="#ba8c00" stroke-width="4"/>
  <text x="185" y="255" text-anchor="middle" class="label">x = 3</text><text x="185" y="292" text-anchor="middle" class="small">entrada</text>
  <text x="480" y="255" text-anchor="middle" class="label">g(x)=√(x+1)</text><text x="480" y="292" text-anchor="middle" class="small">primero g</text>
  <text x="775" y="255" text-anchor="middle" class="label">f(x)=2x+1</text><text x="775" y="292" text-anchor="middle" class="small">después f</text>
  <line x1="285" y1="265" x2="375" y2="265" stroke="#e36b55" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="580" y1="265" x2="670" y2="265" stroke="#e36b55" stroke-width="5" marker-end="url(#arrow2)"/>

</svg>